<section class="section">
  <div class="section-header">
    <div>
      <h2>Ventas</h2>
      <p>En esta colección se referencian clientes y películas, además de embeber activityContext.</p>
    </div>

    <button type="button" onclick="openSaleModal()">
      Nueva venta
    </button>
  </div>

  <div class="filters">
    <input type="text" id="filterCustomerName" placeholder="Buscar por cliente" />
    <input type="text" id="filterMovieTitle" placeholder="Buscar por película" />
    <input type="text" id="filterPaymentMethod" placeholder="Método de pago" />
    <button type="button" onclick="loadSales()">Buscar</button>
    <button type="button" class="secondary-button" onclick="clearSaleFilters()">Limpiar</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID venta</th>
          <th>Cliente</th>
          <th>Película</th>
          <th>Fecha</th>
          <th>App</th>
          <th>Dispositivo</th>
          <th>Pago</th>
          <th>Precio final</th>
          <th>Actividad</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="salesTableBody"></tbody>
    </table>
  </div>
</section>

<div id="saleModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="saleModalTitle">Nueva venta</h2>
      <button type="button" class="close-button" onclick="closeSaleModal()">×</button>
    </div>

        <form id="saleForm" class="form modal-form">
        <input type="hidden" id="saleId" />

        <label class="field">
            <span>Fecha de venta</span>
            <input type="date" id="dayId" required />
        </label>

        <label class="field">
            <span>Cliente</span>
            <select id="saleCustomerSelect" required>
            <option value="">Selecciona un cliente</option>
            </select>
        </label>

        <label class="field">
            <span>Película</span>
            <select id="saleMovieSelect" required onchange="handleMoviePriceChange()">
            <option value="">Selecciona una película</option>
            </select>
        </label>

        <label class="field">
            <span>App</span>
            <input type="text" id="saleApp" placeholder="Ej. chrome" required />
        </label>

        <label class="field">
            <span>Dispositivo</span>
            <input type="text" id="saleDevice" placeholder="Ej. iphone" required />
        </label>

        <label class="field">
            <span>Sistema operativo</span>
            <input type="text" id="saleOs" placeholder="Ej. ios" required />
        </label>

        <label class="field">
            <span>Método de pago</span>
            <input type="text" id="paymentMethod" placeholder="Ej. credit card" required />
        </label>

        <label class="field">
            <span>Precio lista</span>
            <input type="number" id="saleListPrice" placeholder="Ej. 149" required />
        </label>

        <label class="field">
            <span>Tipo de descuento</span>
            <input type="text" id="discountType" placeholder="Ej. promotion, none, student" required />
        </label>

        <label class="field">
            <span>Porcentaje de descuento</span>
            <input type="number" id="discountPercent" placeholder="Ej. 10" required oninput="calculateActualPrice()" />
        </label>

        <label class="field">
            <span>Precio final</span>
            <input type="number" id="actualPrice" placeholder="Ej. 134.10" required />
        </label>

        <label class="field">
            <span>Fecha y hora de actividad</span>
            <input type="datetime-local" id="activityTime" required />
        </label>

        <div class="form-actions">
            <button type="submit">Guardar venta</button>
            <button type="button" class="secondary-button" onclick="closeSaleModal()">Cancelar</button>
        </div>
        </form>
  </div>
</div>
