<section class="section">
  <div class="section-header">
    <div>
      <h2>Películas</h2>
      <p>En esta colección se muestra el género embebido dentro del documento de la película.</p>
    </div>

    <button type="button" onclick="openMovieModal()">
      Nueva película
    </button>
  </div>

  <div class="filters">
    <input type="text" id="searchMovie" placeholder="Buscar por título" />
    <input type="text" id="searchGenre" placeholder="Filtrar por género" />
    <button type="button" onclick="loadMovies()">Buscar</button>
    <button type="button" class="secondary-button" onclick="clearMovieFilters()">Limpiar</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>SKU</th>
          <th>Título</th>
          <th>Año</th>
          <th>Género</th>
          <th>Reparto</th>
          <th>Estudio</th>
          <th>Duración</th>
          <th>Precio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="moviesTableBody"></tbody>
    </table>
  </div>
</section>

<div id="movieModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="movieModalTitle">Nueva película</h2>
      <button type="button" class="close-button" onclick="closeMovieModal()">×</button>
    </div>

    <form id="movieForm" class="form modal-form">
    <input type="hidden" id="movieId" />

    <label class="field">
        <span>Título</span>
        <input type="text" id="title" placeholder="Ej. Ciudad Neón" required />
    </label>

    <label class="field">
        <span>Año</span>
        <input type="number" id="year" placeholder="Ej. 2021" required />
    </label>

    <label class="field">
        <span>Género</span>
        <select id="genreSelect" required onchange="handleGenreChange()">
        <option value="">Selecciona un género</option>
        </select>
    </label>

    <label class="field hidden" id="newGenreField">
        <span>Nuevo género</span>
        <input type="text" id="newGenreName" placeholder="Ej. Romance" />
    </label>

    <label class="field">
        <span>Reparto</span>
        <input type="text" id="cast" placeholder="Ej. Santiago Mora, Elena Cruz" required />
    </label>

    <label class="field">
        <span>Equipo / director</span>
        <input type="text" id="crew" placeholder="Ej. Director: Raúl Ibarra" required />
    </label>

    <label class="field">
        <span>Estudio</span>
        <input type="text" id="studio" placeholder="Ej. Luma Studios" required />
    </label>

    <label class="field">
        <span>Duración en minutos</span>
        <input type="number" id="runtime" placeholder="Ej. 115" required />
    </label>

    <label class="field">
        <span>Precio</span>
        <input type="number" id="listPrice" placeholder="Ej. 149" required />
    </label>

    <label class="field">
        <span>Gross / ingresos</span>
        <input type="text" id="gross" placeholder="Ej. 1125000" />
    </label>

    <label class="field">
        <span>Vistas</span>
        <input type="number" id="views" placeholder="Ej. 31250" />
    </label>

    <label class="field">
        <span>Premios</span>
        <input type="text" id="awards" placeholder="Ej. None" />
    </label>

    <label class="field">
        <span>Presupuesto</span>
        <input type="text" id="budget" placeholder="Ej. 450000" />
    </label>

    <label class="field">
        <span>Nominaciones</span>
        <input type="text" id="nominations" placeholder="Ej. None" />
    </label>

    <label class="field">
        <span>Tema principal</span>
        <input type="text" id="mainSubject" placeholder="Ej. Urban chase" required />
    </label>

    <label class="field">
        <span>Fecha de estreno</span>
        <input type="date" id="openingDate" required />
    </label>

    <label class="field field-full">
        <span>Resumen</span>
        <textarea id="summary" placeholder="Escribe el resumen de la película"></textarea>
    </label>

    <div class="form-actions">
        <button type="submit">Guardar película</button>
        <button type="button" class="secondary-button" onclick="closeMovieModal()">Cancelar</button>
    </div>
    </form>
  </div>
</div>
