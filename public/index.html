<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieStream NoSQL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>MovieStream NoSQL</h1>

    <section class="section">
      <h2>Películas</h2>

      <div class="filters">
        <input 
          type="text" 
          id="searchMovie" 
          placeholder="Buscar por título"
        />

        <input 
          type="text" 
          id="searchGenre" 
          placeholder="Filtrar por género"
        />

        <button onclick="loadMovies()">Buscar</button>
        <button onclick="clearMovieFilters()">Limpiar</button>
      </div>

      <form id="movieForm" class="form">
        <input type="hidden" id="movieId" />

        <input type="text" id="title" placeholder="Título" required />
        <input type="number" id="year" placeholder="Año" required />
        <input type="number" id="genreId" placeholder="ID género" required />
        <input type="text" id="genreName" placeholder="Nombre del género" required />
        <input type="text" id="actors" placeholder="Actores separados por coma" />
        <input type="number" id="runtime" placeholder="Duración en minutos" required />
        <input type="number" id="listPrice" placeholder="Precio" required />

        <button type="submit">Guardar película</button>
        <button type="button" onclick="resetMovieForm()">Cancelar edición</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Año</th>
            <th>Género</th>
            <th>Actores</th>
            <th>Duración</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="moviesTableBody">
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
