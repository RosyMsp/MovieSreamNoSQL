<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieStream NoSQL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      MovieStream NoSQL
    </div>

    <div class="navbar-links">
      <button type="button" id="moviesNavButton" class="nav-button active" onclick="showPage('movies')">
        Películas
      </button>

      <button type="button" id="salesNavButton" class="nav-button" onclick="showPage('sales')">
        Ventas
      </button>

      <button type="button" id="feedbackNavButton" class="nav-button" onclick="showPage('feedback')">
        Feedback
     </button>
    </div>
  </nav>

  <main class="container">
    <header class="main-header">
      <h1>Panel de administración</h1>
      <p>Interfaz web para interactuar con las colecciones movies y custsales en MongoDB.</p>
    </header>

    <section id="movies-page" class="page active-page">
      <div id="movies-section"></div>
    </section>

    <section id="sales-page" class="page">
      <div id="custsales-section"></div>
    </section>

    <section id="feedback-page" class="page">
        <div id="feedback-section"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
